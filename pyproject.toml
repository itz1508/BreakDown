[project]
name = "oneshot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "logfire>=5.4,<6",
    "opentelemetry-api>=1.45.2,<2",
    "pyyaml>=6",
    "rfc8785>=0.1.4",
    "modal>=1.6.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.hatch.build.targets.wheel.force-include]
"config/config.yaml" = "config/config.yaml"
"config/providers/meta.yaml" = "config/providers/meta.yaml"

[project.optional-dependencies]
meta = ["openai>=1.0"]
codex = ["openai-codex"]
mvp = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=2,<3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "deptry>=0.20",
    "httpx>=0.27,<1",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".transfer-quarantine", ".pytest-*", "video/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B017", "S101", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["agents"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib --basetemp=.pytest-tmp"
markers = ["e2e: end-to-end tests that drive real host stores and CLI entrypoints"]

[tool.deptry]
known_first_party = ["agents"]
extend_exclude = ["deployment/modal", ".transfer-quarantine", ".pytest-", "video/examples", "examples"]

[tool.deptry.per_rule_ignores]
DEP001 = ["modal"]
DEP002 = ["openai-codex", "uvicorn", "fastapi", "modal", "openai", "mcp", "logfire", "opentelemetry-api"]
