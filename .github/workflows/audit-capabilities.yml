name: Research Audit Capabilities

on:
  push:
    branches: [main]
    paths:
      - "agent/skills/auditor/**"
      - "agent/skills/auditor/references/audit_guidance.md"
      - "tests/auditoror/**"
      - "mvp/**"
      - "web/**"
      - "system/host/workflow_control.py"
      - ".github/workflows/audit-capabilities.yml"
  pull_request:
    paths:
      - "agent/skills/auditor/**"
      - "agent/skills/auditor/references/audit_guidance.md"
      - "tests/auditoror/**"
      - "mvp/**"
      - "web/**"
      - "system/host/workflow_control.py"
      - ".github/workflows/audit-capabilities.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - run: uv python install 3.11
      - run: uv sync --locked --extra meta --extra mvp
      - name: Verify Audit capability fixtures
        run: uv run --no-sync pytest tests/auditor -q -rs
      - name: Audit checked-out repository
        run: |
          set +e
          uv run --no-sync python -m agent.skills.auditor --root . --scope . --request "Audit accepted Research integration and repository capabilities" > audit-report.json
          audit_status=$?
          set -e
          uv run --no-sync python -c 'import json; p=json.load(open("audit-report.json")); print("Audit disposition:",p["disposition"]); print("Limitations:",p.get("limitations",[]))'
          uv run --no-sync python -c 'import json; p=json.load(open("audit-report.json")); print("Disposition:",p["disposition"]); print("Findings:",len(p["findings"]))'
          exit "$audit_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-capabilities-report
          path: audit-report.json
          if-no-files-found: warn

  connected-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - run: uv python install 3.11
      - run: uv sync --locked --extra meta --extra mvp
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run connected API and browser verification
        env:
          ONESHOT_STATE_ROOT: ${{ runner.temp }}/audit-browser-state
        working-directory: web
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-connected-browser-evidence
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
