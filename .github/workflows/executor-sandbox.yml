name: Modal Sandbox v3 standalone validation

on:
  pull_request:
    paths:
      - 'agent/skills/executor/sandbox/**'
      - '.github/workflows/executor-sandbox.yml'
      - 'tests/boundaries/test_executor_sandbox_layout.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-sandbox-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Python ${{ matrix.python-version }} · standalone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: agent/skills/executor/sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - name: Install selected Python
        run: uv python install ${{ matrix.python-version }}
      - name: Verify pinned dependencies
        run: uv lock --check --python ${{ matrix.python-version }}
      - name: Install provider-neutral core
        run: uv sync --locked --python ${{ matrix.python-version }} --group dev
      - name: Verify core import has no backend side effects
        run: uv run --no-sync python -c "import sys; import oneshot_sandbox.runner; assert 'modal' not in sys.modules"
      - name: Install optional Modal integration
        run: uv sync --locked --python ${{ matrix.python-version }} --group dev --extra modal
      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q src scripts tests
      - name: Ruff lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Ruff format
        if: success() || failure()
        run: uv run --no-sync ruff format --check src tests scripts
      - name: Mypy
        if: success() || failure()
        run: uv run --no-sync mypy src
      - name: Standalone local tests
        if: success() || failure()
        env:
          RUN_MODAL_E2E: '0'
        run: uv run --no-sync pytest -q tests --ignore=tests/integration
      - name: Verify Executor relocation and ownership boundaries
        if: success() || failure()
        run: uv run --no-sync pytest -q "$GITHUB_WORKSPACE/tests/boundaries/test_executor_sandbox_layout.py"
      - name: Report standalone lockfile requirement
        if: success() || failure()
        run: |
          if ! git -C "$GITHUB_WORKSPACE" ls-files --error-unmatch agent/skills/executor/sandbox/uv.lock >/dev/null 2>&1; then
            echo "::warning::The standalone uv.lock is not committed. CI generated a temporary lock only."
          fi
