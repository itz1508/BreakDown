name: One-time BreakDown candidate format
on:
  push:
    branches: [feat/breakdown-package-20261110]
    paths: [.github/workflows/format-feature.yml]
permissions:
  contents: write
jobs:
  format-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - run: uv python install 3.11
      - run: uv sync --locked --extra api --extra meta
      - name: Apply safe Ruff fixes and formatting
        run: |
          uv run --no-sync ruff check --fix --exit-zero .
          uv run --no-sync ruff format .
          git diff --check
      - name: Commit mechanical formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff fixes to consolidated package"
            git push origin "HEAD:refs/heads/feat/breakdown-package-20261110"
          fi
