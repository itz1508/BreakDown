name: Host integrity connected tests

on:
  pull_request:
    paths:
      - 'agents/skills/shared/host/**'
      - 'agents/skills/shared/storage/**'
      - 'tests/e2e/**'
      - '.github/workflows/host-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --extra meta --extra mvp
      - name: Validate host types
        run: uv run --no-sync mypy agents/
      - name: Verify host, dispatch and trust-boundary tests
        run: |
          uv run --no-sync pytest -q \
            tests/e2e/test_workflow_lifecycle.py \
            tests/e2e/test_trust_boundaries.py \
            tests/e2e/test_scanner_checks.py \
            tests/e2e/test_cli_contract.py
