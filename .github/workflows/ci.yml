name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint
        if: always()
        run: uv run --no-sync ruff check .
      - name: Format check
        if: always()
        run: uv run --no-sync ruff format --check .
      - name: Type check (agents and system packages)
        if: always()
        run: uv run --no-sync mypy agents system
      - name: Dependency check
        if: always()
        run: uv run --no-sync deptry .
      - name: Deny restoration of retired packages
        if: always()
        run: uv run --no-sync python scripts/check_retired_paths.py
      - name: Full test suite
        if: always()
        run: uv run --no-sync pytest -q

  package:
    name: package (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - run: uv python install 3.11
      - run: uv sync --locked
      - name: Build wheel
        run: uv build --wheel
      - name: Verify packaged resources
        run: |
          uv run --no-sync python -c 'from pathlib import Path; from zipfile import ZipFile; wheels=list(Path("dist").glob("*.whl")); assert len(wheels) == 1; archive=ZipFile(wheels[0]); expected=("agents/catalog/research_samples.yaml", "agents/skills/researcher/research_catalog.py", "config/config.yaml", "config/providers/meta.yaml"); missing=[x for x in expected if x not in archive.namelist()]; assert not missing, missing'
      - name: Bundle exact source and dependency lock
        run: git archive --format=zip --output=dist/breakdown-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: breakdown-package
          path: |
            dist/*.whl
            dist/breakdown-source.zip
          if-no-files-found: error
