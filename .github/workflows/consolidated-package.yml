name: Consolidated package gate
on:
  push:
    branches:
      - 'consolidation/**'
  pull_request:
    branches:
      - breakdown-staging

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Check complete resolution
        run: uv lock --check
      - name: Install package, Meta, and MVP dependencies
        run: uv sync --locked --extra meta --extra mvp
      - name: Compile Python modules
        run: uv run --no-sync python -m compileall -q agent contracts system mvp api_fundamentals
      - name: Test imports, persistence, API and E2E
        run: uv run --no-sync pytest -q
      - name: Static types
        run: uv run --no-sync mypy agent
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Formatting
        run: uv run --no-sync ruff format --check .
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Verify wheel contains required packages and resources
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              'agent/skills/builder/building.py',
              'agent/skills/researcher/research.yaml',
              'agent/skills/auditor/audit.yaml',
              'agent/catalog/research_samples.yaml',
              'agent/skills/shared/contracts/workflow/common.py',
              'agent/skills/shared/host/sys_controller.py',
              'agent/skills/shared/host/sys_path.py',
              'agent/skills/shared/host/sys_policy_enforcer.py',
          }
          missing = sorted(required - names)
          assert not missing, f'wheel missing files: {missing}'
          print('Package manifest OK:', wheels[0])
          PY
      - name: Upload validated package
        if: success() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consolidated-oneshot-wheel
          path: |
            dist/*.whl
            uv.lock
            pyproject.toml
