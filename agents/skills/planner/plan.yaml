# Planning declares target substeps; all operations remain unbound.
kind: skill_mini_pipeline
definition_version: 1
pipeline_id: planner.plan
owner: planner
workflow_stages: [planning]
processing_plan: PP3
artifact_contract_refs:
  - agents/skills/planner/contracts/specification.py
public_api_intent: planning.create(request, context)
segments:
  - id: main
    steps:
      - id: create_gap_processing_design
        operation_id: planner.create_gap_processing_design
        status: unbound
      - id: gap_resolution
        depends_on: [create_gap_processing_design]
        operation_id: planner.resolve_gaps
        status: unbound
      - id: scan_verify_chaos
        depends_on: [gap_resolution]
        operation_id: planner.scan_verify_chaos
        status: unbound
      - id: create_task_todo
        depends_on: [scan_verify_chaos]
        operation_id: planner.create_task_todo
        status: unbound
      - id: checkpoint_freeze_state
        depends_on: [create_task_todo]
        operation_id: runtime.checkpoint_freeze_state
        status: unbound
      - id: freeze_and_hash
        depends_on: [checkpoint_freeze_state]
        operation_id: planner.freeze_and_hash
        status: unbound
      - id: preflight_check
        depends_on: [freeze_and_hash]
        operation_id: planner.preflight_check
        status: unbound
      - id: decision_point_user_confirmation
        depends_on: [preflight_check]
        operation_id: runtime.route_user_confirmation
        status: unbound
      - id: confirm_plan
        depends_on: [decision_point_user_confirmation]
        operation_id: runtime.confirm_plan
        status: unbound
policy:
  can_approve_or_freeze: false
  runtime_owns_checkpoint_and_confirmation: true
  task_list_field: implementation_steps
  creates_PP4_after_confirm_plan: true
  correction_route_owner: runtime
  on_not_valid_preflight: runtime_recovery
