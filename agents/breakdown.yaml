# OneShot Breakdown — Workflow Definition
#
# Defines task progression, ownership, handoffs and user confirmation.
# Existing application and skill code perform the operations.

workflow_id: oneshot.breakdown
definition_version: 5

processing:
  progression: listed_order_unless_explicitly_rerouted
  handoff: exact_output_or_artifact_reference
  persistence: existing_storage
  missing_information: preserve_progress_and_request_clarification
  clarification:
    records: [question, affected_step, resume_point]
    after_answer: resume_affected_step
  changed_inputs: repeat_affected_checks
  limits: application_configuration

stages:
  - id: user_input
    owner: user
    produces:
      - original_request

  - id: prepare_request
    owner: auditor
    requires:
      - original_request
    uses_when_available:
      - catalog_context
      - repo_summary
      - sys_scan_observations
    purpose: >
      Prepare an editable specification while preserving the original intent.
      Separate supplied facts, inferred suggestions and unknowns.
    sections:
      - item
      - intent_summary
      - requirements
      - current_state
      - research_items
      - user_questions
    produces:
      - discovery.json

  - id: specification_review
    owner: user
    requires:
      - discovery.json
    interface:
      display: streamed_edit_preview
      actions:
        - agent_edit
        - manual_edit
        - add_detail
        - remove_detail
        - accept_and_check
        - decline
    outcomes:
      edited:
        next: specification_review
      accepted:
        next: specification_check
      declined:
        end: without_research
    produces_on_acceptance:
      - accepted_discovery_reference

  - id: specification_check
    owner: auditor
    requires:
      - original_request
      - accepted_discovery_reference
    purpose: >
      Check intent preservation, contradictions, unsupported additions and
      missing user decisions. Do not silently rewrite accepted content.
    produces:
      - specification_check_result
    outcomes:
      ready:
        next: research
      correction_needed:
        next: prepare_request
        preserve: user_edits_and_confirmed_details
      information_needed:
        action: request_clarification
        resume_at: specification_check

  - id: research
    owner: researcher
    requires:
      - original_request
      - accepted_discovery_reference
      - specification_check_result
    purpose: >
      Investigate the accepted research items using supplied capabilities.
      Retain sources, supported options, prerequisites, contradictions and
      unanswered questions.
    produces:
      - audit.json
      - code.json
      - fixture.json
      - case_samples.json
    rules:
      - Keep the four outputs distinct and source-linked.
      - Derive GOOD/BAD expectations independently from candidate results.
      - Do not claim research or execution that was not performed.

  - id: repository_audit
    owner: auditor
    requires:
      - original_request
      - accepted_discovery_reference
      - audit.json
      - code.json
    purpose: >
      Compare research and requested behavior with actual repository source.
      Trace relevant implementations, callers, dependencies and handoffs.
    scaffolding_map_fields:
      - full_path_and_symbol
      - observed_responsibility
      - consumers
      - supporting_evidence
      - proposed_change_if_any
      - preservation_requirements
      - unresolved_questions
    produces:
      - repository_findings
      - scaffolding_map
      - source_checkpoint
      - unresolved_questions

  - id: planning
    owner: planner
    requires:
      - original_request
      - accepted_discovery_reference
      - audit.json
      - code.json
      - fixture.json
      - case_samples.json
      - repository_findings
      - scaffolding_map
      - source_checkpoint
      - unresolved_questions
    purpose: >
      Define implementation design, phases where useful, file-level operations,
      dependencies, expected outcomes and required fixtures.
    rules:
      - Each implementation task owns one file-level operation.
      - A move identifies its source and destination.
      - Independent tasks may run concurrently where safe.
      - Inspect and retain do not authorize rewriting.
      - Material unknowns require clarification rather than invented decisions.
    produces:
      - plan_revision
      - implementation_plan
      - phase_steps
      - task_todo
      - acceptance_criteria
      - fixture_definitions

  - id: check_plan
    owner: planner
    requires:
      - original_request
      - accepted_discovery_reference
      - audit.json
      - code.json
      - fixture.json
      - case_samples.json
      - repository_findings
      - scaffolding_map
      - source_checkpoint
      - plan_revision
      - implementation_plan
      - task_todo
      - acceptance_criteria
      - fixture_definitions
    operations:
      - check_requirement_and_file_references
      - check_dependencies_and_resource_conflicts
      - check_fixture_availability_or_generation_instructions
      - run_required_available_plan_checks
      - assemble_exact_package
      - compute_package_digest
    purpose: >
      Check the proposed execution materials and assemble their exact references.
      Record findings, inspection limits and checks not performed.
    produces:
      - plan_check_results
      - plan_package_reference
      - plan_package_digest
    package_contents:
      - original_request
      - accepted_discovery_reference
      - research_artifact_references
      - repository_findings
      - scaffolding_map
      - source_checkpoint
      - plan_revision
      - implementation_plan
      - task_todo
      - acceptance_criteria
      - fixture_definitions
      - plan_check_results
    reference_mapping:
      research_artifact_references:
        - audit.json
        - code.json
        - fixture.json
        - case_samples.json
    digest_rule: >
      Use existing canonical serialization. Exclude the package digest itself
      and the subsequent user-confirmation record.
    outcomes:
      ready:
        next: plan_confirmation
      correction_needed:
        next: planning
      information_needed:
        action: request_clarification
        resume_at: check_plan

  - id: plan_confirmation
    owner: user
    requires:
      - plan_revision
      - plan_package_reference
      - plan_package_digest
      - source_checkpoint
      - plan_check_results
    purpose: Review the exact proposed execution package.
    confirmation:
      supplied_by: application_recorded_user_decision
      binds_to:
        - plan_revision
        - plan_package_reference
        - plan_package_digest
        - source_checkpoint
      waiting: persist_review_and_return_control_to_user
    outcomes:
      confirmed:
        next: build
      changes_requested:
        next: planning
      declined:
        end: without_build
    produces_on_confirmation:
      - confirmed_package_reference
      - user_confirmation_reference
    confirmed_package_reference_contains:
      - plan_package_reference
      - plan_package_digest
      - plan_revision
      - source_checkpoint

  - id: build
    owner: builder
    requires:
      - confirmed_package_reference
      - user_confirmation_reference
    purpose: >
      Implement the confirmed plan inside the authorized sandbox, execute
      TaskTodo asynchronously and synchronize actual results.
    sequence:
      - verify_confirmed_hashes_and_source_preconditions
      - create_authorized_sandbox
      - implement_and_execute_task_todo_asynchronously
      - run_assigned_checks
      - retain_execution_evidence
      - synchronize_actual_results
    execution_rules:
      - Only dependency-independent tasks may run concurrently.
      - Serialize conflicting file or shared-resource operations.
      - Do not execute dependent work after failed prerequisites.
      - Record failed, uncertain, cancelled and unexecuted tasks honestly.
      - Do not improvise material changes to the confirmed plan.
      - Preserve partial results without presenting them as a successful build.
    cleanup:
      action: exit_sandbox
      when: required_outputs_and_recovery_evidence_are_preserved
      applies_to:
        - completed
        - failed
        - cancelled
      note: Sandbox cleanup does not undo external or synchronized effects.
    resume:
      uses: previous_execution_results
      reconcile_first: uncertain_effects
      execute: remaining_authorized_work_only
    produces:
      - build.json
      - checkpoint
      - synchronization_result
    build_result_contents:
      - task_execution_results
      - assigned_check_results
      - actual_changes
      - execution_evidence
      - failures_and_unknowns
      - synchronization_details
      - cleanup_status
    checkpoint_meaning: >
      Use the existing checkpoint representation to identify the actual resulting
      state. Do not confuse it with the original approved source baseline.
    outcomes:
      synchronized:
        next: completion
      unexpected_source_drift:
        next: repository_audit
      issue:
        action: preserve_progress_and_request_resolution
        resume_at: build

  - id: completion
    owner: application
    requires:
      - build.json
      - checkpoint
      - synchronization_result
    purpose: >
      Close the run with its actual outcome, retained result references and
      unfinished work. Record cleanup status without hiding execution results.
    completion_condition:
      synchronization_result: completed
    outcome:
      derive_from:
        - task_execution_results_in_build_json
        - assigned_check_results_in_build_json
        - failures_and_unknowns_in_build_json
      distinguish:
        - succeeded
        - partial
        - failed
        - uncertain
        - cancelled
    produces:
      - completion_record

change_handling:
  specification_changed:
    return_to: specification_review
    repeat: affected_downstream_work

  plan_package_changed:
    return_to: planning
    requires_renewed_user_confirmation: true

  unexpected_source_change:
    return_to: repository_audit
    repeat: affected_downstream_work
    requires_renewed_confirmation_if_confirmed_inputs_change: true

  historical_outputs:
    preserve: true
    mark: superseded_when_no_longer_applicable

rules:
  - Preserve original intent separately from generated interpretations.
  - Pass exact preceding outputs or artifact references between steps.
  - Preserve full relevant source and evidence; summaries do not replace them.
  - Distinguish facts, inferences, PROPOSALS and executed observations.
  - A model statement or matching hash is not user confirmation.
  - No execution sandbox or application-source effects before plan confirmation.
  - Expected Builder changes are not unexpected source drift.
  - Synchronization success alone does not establish implementation success.
  - Reconcile uncertain effects before retrying.
  - Retain partial results, failures and unknowns with accurate labels.
  - Remove only disposable intermediates after required outputs are preserved.